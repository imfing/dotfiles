set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB,xterm-256color:RGB"   # true 24-bit color passthrough
set -s escape-time 0
set -g extended-keys on
set -g extended-keys-format csi-u
set -g history-limit 10000

# Mouse wheel scrolls in copy mode
bind -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down
set -g focus-events on                              # let vim/nvim detect focus change

# Start windows and panes at 1
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-rename off
set-option -g automatic-rename off

# Remap prefix from 'C-b' to '\'.
unbind C-b
set -g prefix '\'
bind \\ send-prefix

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Use Alt + Arrow keys to switch windows
bind -n M-Left previous-window
bind -n M-Right next-window

# Use Shift + Arrow keys to swap windows left/right
bind -n S-Left swap-window -t -1 -d
bind -n S-Right swap-window -t +1 -d

# Vim-like pane navigation with Alt + H/J/K/L
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize panes with prefix + Shift-H/J/K/L
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind z resize-pane -Z

# Jump to specific windows with Alt + Number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Open windows and panes in current directory
bind c new-window -c "#{pane_current_path}"

bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Kill panes with Prefix + Backspace
bind BSpace confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Clear screen and pane history
bind C-l send-keys C-l \; clear-history

# Capture last N lines of pane history to clipboard
bind C-y command-prompt -p "Copy how many lines?" 'run "tmux capture-pane -pS-%%% | pbcopy"'

# Open a floating scratch terminal (toggle)
bind g display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Use Vim keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"   # yank to macOS clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set -g @catppuccin_flavor 'latte'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{?client_prefix,#[bg=#{@thm_mauve} fg=#{@thm_crust} bold] PREFIX ,}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'                      # auto-restore sessions on tmux start
set -g @continuum-save-interval '60'                # save every 60 minutes (default 15)

run '~/.config/tmux/plugins/tpm/tpm'

