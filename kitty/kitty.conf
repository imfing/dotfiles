# NOTE: kitty.conf has no trailing '#' comments — a '#' anywhere except the
# start of a line becomes part of the value/command. Comments must be their
# own line.

# ── Font ───────────────────────────────────────────────────────────
font_size        14.0

# BEGIN_KITTY_FONTS
font_family      family='Berkeley Mono' postscript_name=BerkeleyMono-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# CJK fallback
symbol_map U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF PingFang SC

# Thicken glyph strokes. gamma: higher = thicker (macOS default 1.7).
# contrast: 0-100, higher = thicker. Below-default gamma looks thin/grayish.
text_composition_strategy 2.0 40

# ── Shell integration ──────────────────────────────────────────────
shell_integration enabled
shell /opt/homebrew/bin/fish --login --interactive

# ── Window ─────────────────────────────────────────────────────────
mouse_hide_wait        -1.0
window_padding_width    8
remember_window_size    yes
hide_window_decorations titlebar-only
macos_option_as_alt     yes

# `splits` = resizable panes, `stack` = zoomed/single pane
enabled_layouts splits,stack

# ── Keybinds ───────────────────────────────────────────────────────
map cmd+h previous_tab
map cmd+l next_tab

# ── Splits ──────────────────────────────────────────────────────────
# cmd+d/shift+d split right/down; cmd+opt+arrows focus; cmd+[/] cycle;
# cmd+ctrl+arrows resize; cmd+shift+enter zoom; cmd+w close.
map cmd+d            launch --location=vsplit --cwd=current
map cmd+shift+d      launch --location=hsplit --cwd=current
map cmd+alt+left     neighboring_window left
map cmd+alt+right    neighboring_window right
map cmd+alt+up       neighboring_window up
map cmd+alt+down     neighboring_window down
map cmd+[            previous_window
map cmd+]            next_window
map cmd+ctrl+left    resize_window narrower
map cmd+ctrl+right   resize_window wider
map cmd+ctrl+up      resize_window taller
map cmd+ctrl+down    resize_window shorter
map cmd+ctrl+0       resize_window reset
map cmd+shift+enter  toggle_layout stack
map cmd+w            close_window

# ── Cursor trail (neovide-like animation) ──────────────────────────
cursor_trail                  3
cursor_trail_decay            0.1 0.4
cursor_trail_start_threshold  2
cursor_blink_interval         0
cursor_shape                  block

# BEGIN_KITTY_THEME
# GitHub Light High Contrast
include current-theme.conf
# END_KITTY_THEME
# 

